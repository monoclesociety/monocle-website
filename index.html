<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#bd182b">
    <meta name="description" content="Monocle Society.">
    <title>Monocle Society</title>
    <link rel="icon" type="image/png" href="./assets/monocle-society.png">
    <style>
      :root { color-scheme: dark; background: #bd182b; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(ellipse at 50% 42%, #d32637 0%, #bd182b 60%, #a41125 100%);
      }
      img { display: block; width: min(181px, 48vw); height: auto; }
    </style>
  </head>
  <body>
    <main aria-label="Monocle Society">
      <img src="./assets/monocle-society.png" alt="Monocle Society" width="181" height="181">
    </main>
  </body>
</html>
